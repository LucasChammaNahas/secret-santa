<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Secret Santa</title>
</head>
<body>
  <h1>Secret Santa</h1>
  <pre id="health">Checking backend…</pre>
  <script>
    fetch("/api/health")
      .then((r) => r.json())
      .then((data) => (document.getElementById("health").textContent = JSON.stringify(data, null, 2)))
      .catch((err) => (document.getElementById("health").textContent = "Error: " + err));
  </script>
</body>
</html>
