<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#fdf9f3">
  <meta name="robots" content="noindex">
  <title>Admin · Amigo Secreto</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎁</text></svg>">
  <link rel="preload" href="/fonts/plus-jakarta-sans.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/epilogue.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-title">Amigo Secreto</span>
      <span class="status-chip"><i></i><span>Área do organizador</span></span>
    </div>
  </header>

  <main>
    <p id="status" class="card status-card">Carregando…</p>

    <form id="login-form" class="card login form" hidden>
      <span class="dialog-icon">
        <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      </span>
      <h2 class="center">Entrar como organizador</h2>
      <p class="muted center">Digite a chave de admin (ADMIN_KEY).</p>
      <input id="key" type="password" autocomplete="current-password" aria-label="Chave de admin" required>
      <button type="submit" class="btn btn-primary btn-block">Entrar</button>
      <p id="error" class="error center" role="alert" hidden></p>
    </form>
  </main>

  <script src="/admin.js"></script>
</body>
</html>
